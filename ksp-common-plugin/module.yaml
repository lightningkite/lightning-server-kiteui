# Runs the service-abstractions database-processor over a module's COMMON sources.
#
# The Toolchain's built-in KSP (settings.kotlin.ksp) wires generated sources into per-platform
# fragments, so common code cannot see them -- and database-processor output contains @JvmName,
# which only compiles when it lands in a common fragment. This plugin drives KSP2 directly and
# declares its output with no fragment clause, which puts it in the common fragment.
product: jvm/amper-plugin

apply:
  - //common.module-template.yaml

dependencies:
  - com.lightningkite.services:database-processor:1.3.0-prerelease-113-79195cb8
  # Matches settings.kotlin.ksp.version, the Toolchain's built-in KSP default.
  - com.google.devtools.ksp:symbol-processing-api:2.3.11
  - com.google.devtools.ksp:symbol-processing-common-deps:2.3.11
  - com.google.devtools.ksp:symbol-processing-aa-embeddable:2.3.11
