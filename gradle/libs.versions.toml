[versions]
agp = "9.1.1"
androidDesugaring = "2.1.5"
dokka = "2.3.0"
firebaseMessagingKtx = "24.1.2"
graalVmNative = "1.1.14"
kfc = "19.16.0"
kotlin = "2.4.21"
kotlinerCli = "1.0.5"
kotlinxCoroutinesTest = "1.11.0"
kotlinxSerializationCsvDurable = "0.2.21-1"
ksp = "2.3.13"
proguard = "7.10.0"
qrcodeKotlin = "4.5.0"
shadow = "8.1.1"
vanniktechPublishing = "0.37.0"

[libraries]
androidDesugaring = { module = "com.android.tools:desugar_jdk_libs", version = { ref = "androidDesugaring" } }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = { ref = "kotlinxCoroutinesTest" } }
kotlinx-serialization-csv-durable = { module = "com.lightningkite:kotlinx-serialization-csv-durable", version = { ref = "kotlinxSerializationCsvDurable" } }
qrcode-kotlin = { module = "io.github.g0dkar:qrcode-kotlin", version = { ref = "qrcodeKotlin" } }
proguard = { module = "com.guardsquare:proguard-gradle", version = { ref = "proguard" } }

# Demo module dependencies - by Claude
firebaseMessagingKtx = { module = "com.google.firebase:firebase-messaging-ktx", version = { ref = "firebaseMessagingKtx" } }
kotlinerCli = { module = "com.lightningkite:kotliner-cli", version = { ref = "kotlinerCli" } }

[plugins]
androidApp = { id = "com.android.application", version = { ref = "agp" } }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version = { ref = "agp" } }
dokka = { id = "org.jetbrains.dokka", version = { ref = "dokka" } }
graalVmNative = { id = "org.graalvm.buildtools.native", version = { ref = "graalVmNative" } }
kfc = { id = "io.github.turansky.kfc.application", version = { ref = "kfc" } }
kjsplain = { id = "org.jetbrains.kotlin.plugin.js-plain-objects", version = { ref = "kotlin" } }
kotlin-cocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version = { ref = "kotlin" } }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = { ref = "kotlin" } }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version = { ref = "kotlin" } }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = { ref = "kotlin" } }
ksp = { id = "com.google.devtools.ksp", version = { ref = "ksp" } }
shadow = { id = "com.github.johnrengelman.shadow", version = { ref = "shadow" } }
vanniktechPublishing = { id = "com.vanniktech.maven.publish", version = { ref = "vanniktechPublishing" } }
