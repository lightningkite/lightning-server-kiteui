android.useAndroidX=true
org.gradle.jvmargs=-XX:MaxMetaspaceSize=512m -Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M"
kotlin.code.style=official

# Works around an infinite recursion in KSP 2.3.10's K2 backend: IncrementalContextAA.filePathFor()
# calls toString() on a KSValueArgument, and for a class-literal argument (`Foo::class`) that
# resolves the value by calling recordClassReferenceLookup() again, which calls filePathFor() -
# no cycle guard, so it never terminates.  Any KClass-valued annotation reaches it; ours come from
# @References and @file:UseContextualSerialization.  It surfaces as an intermittent
# `[ksp] java.lang.StackOverflowError` in kspTestKotlin*, intermittent only because the crash needs
# a real regeneration and a lock-file race decides whether one happens.  It is genuinely unbounded,
# not a deep-but-finite walk - raising -Xss to 256m changes nothing.  This flag skips the
# incremental change-tracking that IncrementalContextAA exists to serve; the cost is that KSP always
# does a full regeneration.  Retest on the next KSP upgrade.
ksp.incremental=false

systemProp.javax.xml.parsers.SAXParserFactory=com.sun.org.apache.xerces.internal.jaxp.SAXParserFactoryImpl
systemProp.javax.xml.transform.TransformerFactory=com.sun.org.apache.xalan.internal.xsltc.trax.TransformerFactoryImpl
systemProp.javax.xml.parsers.DocumentBuilderFactory=com.sun.org.apache.xerces.internal.jaxp.DocumentBuilderFactoryImpl

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
kfc.source.maps=true
kfc.strict.mode=false