apply:
  - //jvm.module-template.yaml
  - //explicit-api.module-template.yaml
  - //publishing.module-template.yaml

product: jvm/lib

dependencies:
  - com.lightningkite.lightningserver:typed:5.3.0-prerelease-147-6268bcb2: exported
  - com.lightningkite.kiteui:library-jvmssr:8.3.0-prerelease-191-2921c5985: exported

test-dependencies:
  - $kotlin.test

settings:
  kotlin:
    ksp:
      processors:
        - com.lightningkite.services:database-processor:1.3.0-prerelease-113-79195cb8
      processorOptions:
        generateFields: "true"

# Gradle names the Kotlin module "<group>:<artifact>", which determines the META-INF/*.kotlin_module
# entry. The Toolchain defaults to the module directory name, so it is restated here.
settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:server-client-utils" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, server-client-utils_test ]
